name: DynamicCVPipeline Tests
# Triggered after DynamicCVPipeline Trigger completes, or manually via
# workflow_dispatch to re-run the test alone (assumes the remote server
# is available).
#
# All paths run in base-repo context, so secrets are available even for fork
# PRs. NEVER check out the PR head SHA — fork code must not execute under
# the secret-bearing token.

on:
  workflow_run:
    workflows: ["DynamicCVPipeline Trigger"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_id:
        description: PR number to (re)trigger test against
        required: true

concurrency:
  # Serial execution — remote server resource is limited; do not cancel a
  # running test (the in-progress SSH session would be orphaned).
  group: dcv-pipeline-${{ inputs.pr_id || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  remote-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: linux-amd64-cpu-16
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Default checkout pulls the base repo at the workflow's ref (safe).
      # Do not pass ref: head_sha — that would execute fork code.
      - uses: actions/checkout@v4

      - name: Resolve PR context
        id: ctx
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # workflow_dispatch → use input directly.
          # workflow_run  → resolve from head repo/branch.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_ID="${{ inputs.pr_id }}"
          else
            HEAD_OWNER="${{ github.event.workflow_run.head_repository.owner.login }}"
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            NUM=$(gh api "/repos/${{ github.repository }}/pulls?state=open&head=${HEAD_OWNER}:${HEAD_BRANCH}" \
                    --jq 'if length > 0 then .[0].number else empty end')
            if [ -z "${NUM}" ]; then
              echo "No open PR found for ${HEAD_OWNER}:${HEAD_BRANCH}; nothing to test."
              echo "pr_id=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PR_ID="${NUM}"
          fi

          P=$(gh pr view "$PR_ID" --repo "${{ github.repository }}" --json headRefOid)
          HEAD_SHA=$(echo "$P" | jq -r .headRefOid)

          {
            echo "pr_id=$PR_ID"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Set commit status (pending)
        if: steps.ctx.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ctx.outputs.head_sha }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=pending \
            -f context='DynamicCVPipeline Tests' \
            -f description='Pipeline running' \
            -f target_url="$TARGET"

      - name: Run remote test via SSH
        id: run
        if: steps.ctx.outputs.pr_id != ''
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DYNAMIC_CV_TEST_HOST }}
          SSH_USER: ${{ secrets.DYNAMIC_CV_TEST_USER }}
          SSH_PASSWORD: ${{ secrets.DYNAMIC_CV_TEST_PASSWORD }}
          PR_NUM: ${{ steps.ctx.outputs.pr_id }}
        run: |
          set -euo pipefail

          sudo apt-get install -y sshpass expect

          # Legacy KexAlgorithms required by older SSH server
          SSH_OPTS="-o StrictHostKeyChecking=no -o KexAlgorithms=diffie-hellman-group-exchange-sha1,diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 -o HostKeyAlgorithms=+ssh-rsa -o PreferredAuthentications=password,keyboard-interactive -o PasswordAuthentication=yes -o PubkeyAuthentication=no"

          REMOTE_TMP="/tmp/dynamic-cv-pr-${PR_NUM}"

          # Use expect to handle SSH password prompt reliably
          run_remote() {
            local HOST="$1"; local USER="$2"; local PASS="$3"; local CMD="$4"
            expect -c "
              set timeout 300
              spawn ssh ${SSH_OPTS} ${USER}@${HOST} {${CMD}}
              expect {
                \"assword:\" { send \"${PASS}\r\"; exp_continue }
                eof { catch wait result; exit [lindex \$result 3] }
                timeout { exit 1 }
              }
            "
          }

          run_remote "${SSH_HOST}" "${SSH_USER}" "${SSH_PASSWORD}" "
            docker start z00896713
            docker exec z00896713 bash -c '
              chmod -R a+rwX /home/z00896713
              cd /home/z00896713/ci
              python ci.py
            '
            mkdir -p ${REMOTE_TMP}
            docker cp z00896713:/home/z00896713/ci/hello.txt ${REMOTE_TMP}/hello.txt
          "

          # Copy hello.txt back from remote
          export SSHPASS="${SSH_PASSWORD}"
          sshpass -e scp ${SSH_OPTS} \
            ${SSH_USER}@${SSH_HOST}:${REMOTE_TMP}/hello.txt ./hello.txt

          # Cleanup remote temp
          run_remote "${SSH_HOST}" "${SSH_USER}" "${SSH_PASSWORD}" \
            "rm -rf ${REMOTE_TMP}"

      - name: Upload hello.txt as PR artifact
        if: steps.ctx.outputs.pr_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: hello-txt-pr-${{ steps.ctx.outputs.pr_id }}
          path: ./hello.txt

      - name: Set commit status (final)
        if: always() && steps.ctx.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ctx.outputs.head_sha }}
          STATE: ${{ steps.run.outcome == 'success' && 'success' || 'failure' }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="$STATE" \
            -f context='DynamicCVPipeline Tests' \
            -f description="${STATE}" \
            -f target_url="$TARGET"
